version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns:
                  - '*'
      cooldown:
          default-days: 10

    # `uv` rather than `pip`: the lockfile is what CI verifies, and a pip-only
    # bump would leave uv.lock stale so every automated pull request failed
    # `uv sync --locked`.
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      groups:
          uv-patch:
              patterns:
                  - '*'
              update-types:
                  - patch
          uv-minor:
              patterns:
                  - '*'
              update-types:
                  - minor
          uv-major:
              patterns:
                  - '*'
              update-types:
                  - major
      cooldown:
          default-days: 10
          semver-patch-days: 5
          semver-minor-days: 10
          semver-major-days: 20
