name: Set up git-ferret
description: Install Python and git-ferret with the optional dependencies a job needs

inputs:
    python-version:
        description: Python version to install
        required: false
        default: '3.14'
    extras:
        description: Comma-separated extras from pyproject.toml, empty for a runtime install
        required: false
        default: ''

# The checkout stays in the calling job. A local action is read from the
# workspace, so it cannot be the step that populates it.
runs:
    using: composite
    steps:
        - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
          with:
              python-version: ${{ inputs.python-version }}
              cache: 'pip'
              cache-dependency-path: pyproject.toml
        - name: Install git-ferret
          shell: bash
          env:
              EXTRAS: ${{ inputs.extras }}
          run: |
              if [ -n "$EXTRAS" ]; then
                  python -m pip install -e ".[$EXTRAS]"
              else
                  python -m pip install -e .
              fi
