name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.13'
                  cache: 'pip'
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e ".[dev]"
            - run: make format-check lint PYTHON=python

    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.13'
                  cache: 'pip'
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e ".[dev]"
            - run: make typecheck PYTHON=python

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.11', '3.12', '3.13', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: 'pip'
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e ".[dev]"
            - run: make test PYTHON=python

    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.13'
                  cache: 'pip'
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e ".[dev]"
            - run: make coverage PYTHON=python
            - name: Upload coverage results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report
                  path: |
                      coverage.xml
                      htmlcov/
                  retention-days: 7

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.13'
                  cache: 'pip'
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e ".[dev]"
            - run: make build PYTHON=python
            - name: Smoke-test the wheel
              run: |
                  python -m pip install --force-reinstall --no-deps dist/*.whl
                  git-ferret --help
            - name: Upload distributions
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.13'
                  cache: 'pip'
                  cache-dependency-path: pyproject.toml
            - run: python -m pip install -e ".[dev]"
            - name: Audit dependencies
              run: python -m pip_audit . --skip-editable --progress-spinner off

    merge-gate:
        runs-on: ubuntu-latest
        if: always()
        needs: [lint, type-check, test, coverage, build, audit]
        steps:
            - name: Check for failures
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
            - run: echo "All required jobs succeeded!"
