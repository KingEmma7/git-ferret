name: Set up git-ferret
description: Install Python and git-ferret from the locked uv environment

inputs:
    python-version:
        description: Python version to install
        required: false
        default: '3.14'
    extras:
        description: One optional-dependency group from pyproject.toml, empty for a runtime install
        required: false
        default: ''

# The checkout stays in the calling job. A local action is read from the
# workspace, so it cannot be the step that populates it.
runs:
    using: composite
    steps:
        # Activate the venv so every later step uses it directly: `python`,
        # `make`, and the project's console scripts resolve inside `.venv`
        # without a `uv run` prefix, including steps in the calling job.
        - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
          with:
              version: '0.9.26'
              python-version: ${{ inputs.python-version }}
              enable-cache: true
              cache-dependency-glob: uv.lock
              activate-environment: true
        - name: Install git-ferret from uv.lock
          shell: bash
          env:
              EXTRAS: ${{ inputs.extras }}
          run: |
              if [ -n "$EXTRAS" ]; then
                  uv sync --locked --extra "$EXTRAS"
              else
                  uv sync --locked
              fi
