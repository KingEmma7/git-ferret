version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns:
                  - '*'
      cooldown:
          default-days: 10

    - package-ecosystem: pip
      directory: /
      schedule:
          interval: weekly
      groups:
          pip-patch:
              patterns:
                  - '*'
              update-types:
                  - patch
          pip-minor:
              patterns:
                  - '*'
              update-types:
                  - minor
          pip-major:
              patterns:
                  - '*'
              update-types:
                  - major
      cooldown:
          default-days: 10
          semver-patch-days: 5
          semver-minor-days: 10
          semver-major-days: 20
