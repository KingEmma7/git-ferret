[build-system]
# 77 is the floor for PEP 639: `license` as an SPDX expression and
# `license-files` are silently ignored by anything older.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ferret"
version = "0.1.0"
description = "Read-only reporting tool for auditing many local git repositories"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Fran" }]
keywords = ["git", "repository", "audit", "branches", "cleanup", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
# 0.27.2 is the floor because it is the first release that exposes its own
# exception hierarchy (`typer.TyperException`). Below it an unknown flag
# arrives as an exception from whichever copy of click is in play -- typer
# vendored its own at 0.26.0 -- and main()'s handler cannot cover both without
# probing the installed version at runtime, which leaves 0.26.x-0.27.1 raising
# a traceback for a typo.
dependencies = ["typer>=0.27.2", "rich>=13", "click>=8.1"]

[project.optional-dependencies]
# Split by tool so a CI job installs only what it runs. There is no `dev`
# umbrella: a self-referential extra (`dev = ["git-ferrat[lint,test]"]`) does
# not resolve for a package that is not on an index yet. `make install`
# asks for all of these at once.
lint = ["ruff~=0.17.1"]
# pytest is here because pyright type-checks the tests, not just the package:
# without it installed, every `import pytest` in the suite is unresolved and the
# whole job fails on errors that are not real.
type = ["pyright[nodejs]~=1.1.414", "pytest>=8"]
test = ["pytest>=8", "pytest-cov>=6"]
build = ["build>=1.3", "twine>=6"]
audit = ["pip-audit>=2.10"]

[project.scripts]
git-ferret = "git_ferret.cli:main"

[project.urls]
Homepage = "https://github.com/fran2889/git-ferret"
Repository = "https://github.com/fran2889/git-ferret"
Issues = "https://github.com/fran2889/git-ferret/issues"
Changelog = "https://github.com/fran2889/git-ferret/releases"

[tool.setuptools.packages.find]
include = ["git_ferret*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
# Typer options are declared in parameter defaults by design.
"git_ferret/cli.py" = ["B008"]

[tool.pyright]
include = ["git_ferret", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["git_ferret"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The suite is at 98.9%, so 95 is a floor that catches a real drop. CI runs
# only 3.14, the version this number was measured on, so there is no
# cross-version drift left to absorb.
fail_under = 95
