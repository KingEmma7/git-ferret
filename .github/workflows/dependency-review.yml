name: Dependency Review

on:
    pull_request:
        branches: ['**']

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  # A moderate finding is worth stopping for: this package
                  # shells out to git and runs in a directory of the user's
                  # repositories, so a dependency flaw is not cosmetic.
                  fail-on-severity: moderate
