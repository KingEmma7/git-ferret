name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: lint
            - run: make format-check lint check-spdx PYTHON=python

    type-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: type
            - run: make typecheck PYTHON=python

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                # One version on purpose: requires-python is >=3.14, so this is
                # the only interpreter the package claims to work on and the
                # only one worth a job. Add a row here only alongside a
                # requires-python change that admits it.
                python-version: ['3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  python-version: ${{ matrix.python-version }}
                  extras: test
            - run: make test PYTHON=python

    coverage:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: test
            - run: make coverage PYTHON=python
            - name: Summarise coverage in the run summary
              run: python scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
            - name: Upload coverage results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-report
                  path: |
                      coverage.xml
                      htmlcov/
                  retention-days: 7

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: build
            - run: make build PYTHON=python
            - name: Smoke-test the wheel
              run: |
                  python -m pip install --force-reinstall --no-deps dist/*.whl
                  git-ferret --help
            - name: Upload distributions
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
              with:
                  extras: audit
            - name: Audit dependencies
              run: make audit PYTHON=python

    merge-gate:
        runs-on: ubuntu-latest
        if: always()
        needs: [lint, type-check, test, coverage, build, audit]
        steps:
            - name: Check for failures
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
            - run: echo "All required jobs succeeded!"
